name: Package Staging & Publish

on:
  push:
    branches:
      - main
    paths:
      - 'src/components/liquid-glass/**'
      - 'src/index.ts'
      - 'scripts/copy-static.mjs'
      - 'tsconfig.build.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'README.md'
      - '.github/workflows/staging.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # Required for npm Trusted Publishing (OIDC) & provenance

jobs:
  stage-and-publish:
    name: Build, Verify & Publish Package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.3.4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run TypeScript typecheck
        run: pnpm run typecheck

      - name: Run unit tests
        run: pnpm test

      - name: Build package artifacts
        run: pnpm run build

      - name: Validate documentation site build
        run: pnpm run site:build

      - name: Check if version is already published
        id: check_version
        run: |
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          echo "Checking registry for $PACKAGE_NAME@$PACKAGE_VERSION..."

          if npm view "$PACKAGE_NAME@$PACKAGE_VERSION" version > /dev/null 2>&1; then
            echo "Version $PACKAGE_VERSION is already published on npm. Skipping publication."
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "Version $PACKAGE_VERSION is new. Proceeding with publication."
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upgrade npm CLI to latest (required for OIDC Trusted Publishing)
        if: steps.check_version.outputs.should_publish == 'true'
        run: npm install -g npm@latest

      - name: Stage package to npm (npm stage publish)
        if: steps.check_version.outputs.should_publish == 'true'
        run: npm stage publish --provenance --access public

      - name: Stage package tarball (pnpm pack)
        run: |
          pnpm pack
          echo "Tarball created:"
          ls -la *.tgz

      - name: Upload staged package artifact
        uses: actions/upload-artifact@v4
        with:
          name: liquid-glass-staged-package
          path: '*.tgz'
          retention-days: 14

      - name: Execution Summary
        run: |
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          echo "### 📦 Package Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Package**: \`$PACKAGE_NAME\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Version**: \`$PACKAGE_VERSION\`" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.check_version.outputs.should_publish }}" = "true" ]; then
            echo "- **Stage Status**: 🚀 Submitted to npm staging queue with Provenance" >> $GITHUB_STEP_SUMMARY
            echo "- **Approval**: Maintainer can approve on npmjs.com (Staged Packages tab) or via \`npm stage approve <stage-id>\`" >> $GITHUB_STEP_SUMMARY
          else
            echo "- **Stage Status**: ℹ️ Version already exists on npm (Skipped)" >> $GITHUB_STEP_SUMMARY
          fi
          echo "- **Artifact**: Release tarball generated and uploaded" >> $GITHUB_STEP_SUMMARY
