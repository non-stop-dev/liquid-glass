name: Package Staging

on:
  push:
    branches:
      - main
    paths:
      - 'src/components/liquid-glass/**'
      - 'src/index.ts'
      - 'scripts/copy-static.mjs'
      - 'tsconfig.build.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'README.md'
      - '.github/workflows/staging.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stage-package:
    name: Build, Verify & Stage Package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.3.4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run TypeScript typecheck
        run: pnpm run typecheck

      - name: Run unit tests
        run: pnpm test

      - name: Build package artifacts
        run: pnpm run build

      - name: Validate documentation site build
        run: pnpm run site:build

      - name: Stage package tarball (pnpm pack)
        run: |
          pnpm pack
          echo "Tarball created:"
          ls -la *.tgz

      - name: Verify package dry-run
        run: pnpm publish --dry-run --no-git-checks

      - name: Upload staged package artifact
        uses: actions/upload-artifact@v4
        with:
          name: liquid-glass-staged-package
          path: '*.tgz'
          retention-days: 14

      - name: Staging Summary
        run: |
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          echo "### 📦 Package Staging Successful" >> $GITHUB_STEP_SUMMARY
          echo "- **Package**: \`$PACKAGE_NAME\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Version**: \`$PACKAGE_VERSION\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: Staged & Verified (Ready for manual \`pnpm publish\`)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "The release tarball has been uploaded as an artifact to this workflow run." >> $GITHUB_STEP_SUMMARY
