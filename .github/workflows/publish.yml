name: Publish Package

on:
  push:
    branches:
      - main
    paths:
      - 'src/components/liquid-glass/**'
      - 'src/index.ts'
      - 'scripts/copy-static.mjs'
      - 'tsconfig.build.json'
      - 'package.json'
      - '.github/workflows/publish.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # Required for npm Trusted Publishing (OIDC) & provenance

jobs:
  verify-and-publish:
    name: Verify & Publish to npm
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.3.4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run TypeScript typecheck
        run: pnpm run typecheck

      - name: Run unit tests
        run: pnpm test

      - name: Build package artifacts
        run: pnpm run build

      - name: Validate documentation site build
        run: pnpm run site:build

      - name: Check if version is already published
        id: check_version
        run: |
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          echo "Checking registry for $PACKAGE_NAME@$PACKAGE_VERSION..."

          if npm view "$PACKAGE_NAME@$PACKAGE_VERSION" version > /dev/null 2>&1; then
            echo "Version $PACKAGE_VERSION is already published on npm. Skipping publication."
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "Version $PACKAGE_VERSION is new. Proceeding with publication."
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm (OIDC Trusted Publishing)
        if: steps.check_version.outputs.should_publish == 'true'
        run: pnpm publish --access public --provenance --no-git-checks || npm publish --access public --provenance
